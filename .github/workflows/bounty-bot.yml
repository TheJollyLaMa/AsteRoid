name: Bounty Bot
on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged PR number for recovery
        required: true
        type: string
      issue_number:
        description: Optional comma-separated same-repo issues
        required: false
        type: string
permissions: {}
concurrency:
  group: asteroid-ledger-main
  cancel-in-progress: false
jobs:
  queue:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Accrue merged PR bounty (never checkout PR code)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: node scripts/processMergedBounty.js
      - name: Validate and test payroll
        run: |
          node scripts/validatePayrollQueue.js
          node --test tests/payroll.test.js
      - name: Persist reviewed automation ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add payroll-queue.json contributor-accounts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: accrue merged repository bounty" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin HEAD:main
