name: Victory Stamp Request
description: Submit a pinned level 20 achievement for owner-reviewed Base minting
title: "Victory stamp: "
labels: [victory-stamp]
body:
  - type: markdown
    attributes:
      value: |
        Paste a Pilot or Ace level 20 Victory Vault claim JSON. Earlier levels are flight history, not new achievement mints.
        This requests review; it does not mint an NFT.
        All IPFS metadata and claimant addresses are public. Do not include keys or private information.
  - type: textarea
    id: claim
    attributes:
      label: Claim JSON
      description: The asteroid-dnft-claim/1 compatibility-format object copied from Voyager's flight records
      render: json
    validations:
      required: true
